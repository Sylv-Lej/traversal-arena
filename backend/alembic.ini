# Migrations du schéma Postgres (Lampion). Appliquées automatiquement au démarrage du
# backend (app/main.py) ; l'URL vient de DATABASE_URL, jamais de ce fichier.
#   alembic revision --autogenerate -m "..."   (avec DATABASE_URL pointant vers une base)
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
